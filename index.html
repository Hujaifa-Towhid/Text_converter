<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Fancy Text Converter</title>
    <style>
        /* --- Global Styles & Fonts --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --secondary-color: #6c757d;
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --text-color: #333;
            --border-color: #dee2e6;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --gradient-start: #6dd5ed;
            --gradient-end: #2193b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: var(--text-color);
        }

        /* --- Main Container --- */
        .container {
            background-color: var(--card-background);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px var(--shadow-color);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        
        p {
            margin-bottom: 2rem;
            color: var(--secondary-color);
        }

        /* --- Input Area --- */
        #inputText {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1.1rem;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 2rem;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s ease;
        }

        #inputText:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* --- Output Area --- */
        #outputContainer {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .output-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            background-color: var(--background-color);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .style-name {
            font-weight: 600;
            color: var(--primary-color);
            flex-shrink: 0;
            width: 140px; /* Aligns text and buttons */
            text-align: left;
        }

        .converted-text {
            flex-grow: 1;
            text-align: left;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 1.1rem;
        }

        .copy-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            background-color: var(--secondary-color);
            color: white;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        
        .copy-btn:hover {
            background-color: #5a6268;
            transform: scale(1.05);
        }

        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            body {
                padding: 1rem 0.5rem;
            }
            .container {
                padding: 1.5rem;
            }
            h1 {
                font-size: 2rem;
            }
            .output-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
            .style-name {
                width: 100%;
            }
            .converted-text {
                width: 100%;
            }
            .copy-btn {
                align-self: flex-end;
            }
        }
    </style>
</head>

            // --- Conversion Logic ---
            const convertText = (text, styleName) => {
                const style = styles[styleName];
                if (!style) return text;
                
                if (style.type) {
                    switch (style.type) {
                        case 'combinator': return text.split('').map(char => char + style.value).join('');
                        case 'wrapper': return text.split('').map(char => char.trim() === '' ? char : style.start + char + style.end).join('');
                        case 'joiner': return text.split('').join(style.value);
                        case 'vaporwave': return convertText(text, 'Full Width').split('').join(' ');
                        default: return text;
                    }
                }

                let result = '';
                for (const char of text) {
                    result += style[char] || style[char.toLowerCase()] || char;
                }
                
                return (styleName === 'Upside Down') ? result.split('').reverse().join('') : result;
            };

            const generateOutputRows = () => {
                for (const styleName in styles) {
                    // Create elements
                    const row = document.createElement('div');
                    row.className = 'output-row';

                    const nameLabel = document.createElement('div');
                    nameLabel.className = 'style-name';
                    nameLabel.textContent = styleName;

                    textOutput.className = 'converted-text';

                    copyButton.textContent = 'Copy';

                    copyButton.addEventListener('click', () => {

                    outputContainer.appendChild(row);
                }
            };

            const updateAllOutputs = () => {
                const text = inputText.value;
                const outputElements = document.querySelectorAll('.converted-text');
                
                outputElements.forEach(el => {
                    const styleName = el.dataset.style;
                    if (text) {
                        el.textContent = convertText(text, styleName);
                    } else {
                        el.textContent = 'Output appears here...';
                    }
                });
            };

            // --- Event Listener for Instant Conversion ---
            generateOutputRows();
            inputText.addEventListener('input', updateAllOutputs);
